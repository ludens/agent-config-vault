[package]
name = "agent-config-vault-desktop"
version = "2026.07.28.0"
description = "agent-config-vault desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "agent_config_vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

